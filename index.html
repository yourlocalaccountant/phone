<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1f3f">
<title>OnDuty – Browser Recreation</title>
<link rel="icon" href="assets/icon-onduty.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
  <aside id="panel">
    <div class="panel-head">
      <img src="assets/icon-onduty.svg" alt="" class="panel-icon">
      <div>
        <h1>OnDuty</h1>
        <p>Interactive browser recreation</p>
      </div>
    </div>
    <p class="panel-note">Unofficial mock-up rebuilt from the publicly released OIA document IR-01-23-16062. Every person, vehicle, location and record is fictional demo data. Nothing is sent anywhere – state is kept in this browser only.</p>
    <div class="panel-controls">
      <label class="pc-toggle"><input type="checkbox" id="pc-offline"> <span>Offline (airplane mode)</span></label>
      <div class="pc-row">
        <button id="pc-home" type="button">Home screen</button>
        <button id="pc-reset" type="button">Reset demo data</button>
      </div>
      <div class="pc-route">Route: <code id="pc-route">/</code></div>
    </div>
    <input id="pc-filter" type="search" placeholder="Filter screens…" autocomplete="off">
    <nav id="directory"></nav>
  </aside>
  <main id="device-wrap">
    <div id="device">
      <div id="screen-area">
        <div id="statusbar"></div>
        <div id="app-root"></div>
        <div id="overlay-root"></div>
        <div id="toast-root"></div>
        <div id="home-indicator" title="Swipe up / click to go to the home screen"></div>
      </div>
      <div class="notch"></div>
    </div>
  </main>
  <button id="dir-fab" type="button" aria-label="Screen directory">☰</button>
</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/forms.js"></script>
<script src="js/paperwork.js"></script>
<script src="js/pw-types.js"></script>
<script src="js/screens-home.js"></script>
<script src="js/screens-query.js"></script>
<script src="js/screens-tabs.js"></script>
<script src="js/sam.js"></script>
<script src="js/app.js"></script>
</body>
</html>
